<style>
    table {
        border-collapse: collapse;
    }

    table tr th,
    td {
        width: 150px;
        height: 30px;
        text-align: left;
        border: 1px solid black;
        padding: 10px;
    }
</style>

<body>
    <h1>Tính chỉ số cân nặng của cơ thể</h1>
    <table>
        <tr>
            <th>BMI</th>
            <th>Interpretation</th>
        </tr>
        <tr>
            <td> BMI &lt; 18.5</td>
            <td>Underweight</td>
        </tr>
        <tr>
            <td>18.5 &le; BMI &lt; 25.0</td>
            <td>Normal</td>
        </tr>
        <tr>
            <td>25.0 &le; BMI &lt; 30.0</td>
            <td>Overweight</td>
        </tr>
        <tr>
            <td>30.0 &le; BMI</td>
            <td>Obese</td>
        </tr>
    </table>
    <p id="resultBMI"></p>

    <script src="app.js"></script>
</body>

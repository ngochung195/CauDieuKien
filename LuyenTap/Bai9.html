<body>
    <h3>Kiểm tra 3 cạnh tam giác</h3>

    <label>Nhập cạnh a: </label>
    <input type="number" id="a">
    <br><br>

    <label>Nhập cạnh b: </label>
    <input type="number" id="b">
    <br><br>

    <label>Nhập cạnh c: </label>
    <input type="number" id="c">
    <br><br>

    <button onclick="kiemTraTamGiac()">Kiểm tra</button>

    <p id="result"></p>

    <script>
        function kiemTraTamGiac() {
            let a = Number(document.getElementById('a').value);
            let b = Number(document.getElementById('b').value);
            let c = Number(document.getElementById('c').value);
            let kq = document.getElementById('result');

            if (a > 0 && b > 0 && c > 0 && (a + b > c) && (b + c > a) && (a + c > b)) {
                kq.innerHTML = `Ba số (${a}, ${b}, ${c}) là 3 cạnh của một tam giác.`;
            } else {
                kq.innerHTML = `Ba số (${a}, ${b}, ${c}) không phải là 3 cạnh của một tam giác.`;
            }
        }
    </script>
</body>

<body>
    <h3>Diện tích tam giác vuông</h3>

    <script>
        let a = Number(prompt("Nhập cạnh a: "));

        let b = Number(prompt("Nhập cạnh b: "));

        let S = (1 / 2) * a * b;

        document.write(`Diện tích tam giác vuông 2 cạnh bên bằng ${a} và ${b} là: ${S}`);
    </script>
</body>
